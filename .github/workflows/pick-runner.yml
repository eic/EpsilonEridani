name: pick-runner

# Decides whether a sandboxed job runs on a GitHub-hosted runner or on Namespace. Called as the
# first job of pr-build.yml and nightly-verify.yml, whose own `runs-on` holds both label sets.
#
# The organisation's free plan runs at most 20 GitHub-hosted jobs at once, across every repository
# in it; the 21st sits queued until a slot frees. Standard GitHub-hosted runners are not billed for
# public repositories (the monthly minute allowance applies only to private ones), while Namespace
# bills every minute, so a build takes a GitHub slot when one is free and goes to Namespace when
# they are all taken. This stops being free if a repository goes private or a job moves to a
# GitHub "larger runner", which is billed even for public repositories.
#
# There is no API for the plan's current usage, so this counts it: every job in every repository
# of the organisation that holds or waits for a GitHub-hosted runner. An in-progress job counts
# when its runner is in the "GitHub Actions" group, which only GitHub-hosted runners join; a queued
# job has no runner yet, so it counts when it asks for a GitHub-hosted image (`ubuntu-*`,
# `windows-*`, `macos-*`) and for no self-hosted or Namespace label. Jobs on self-hosted or
# Namespace runners, and jobs queued for labels nothing serves, take no GitHub slot and are not
# counted. The count includes this job, whose slot the build inherits when this job ends. A build
# goes to GitHub only while the count is at most `vars.HOSTED_RUNNER_BUDGET` (default 16). The
# budget sits below 20 for two reasons: pickers running at the same moment each see the same count
# and can all choose GitHub, and a slot held by an hour-long build is a slot the short label, merge
# and notification jobs cannot use. Set the variable to 20 to use every slot. The step summary
# lists the counted jobs by repository, status and labels.
#
# Any failure (API error, timeout, rate limit, a page that fails to load) answers Namespace,
# and a caller whose picker did not produce an answer at all also falls back to Namespace. The job is
# `continue-on-error`, so even a picker that crashes leaves the caller's run green: review.yml and
# auto-merge key off pr-build's overall conclusion. This job can delay a build by its own runtime
# but can never stop one.
#
# The picker itself needs a GitHub slot. When all 20 are taken it waits for one, and then answers
# Namespace; the budget's headroom and the churn of short jobs keep that wait short.
#
# Namespace can be switched off entirely by setting the repository variable `NAMESPACE_RUNNERS`
# to `off` (for example while Namespace is not provisioning runners). Callers then skip this job
# and run every build, merge-queue and nightly builds included, on GitHub-hosted runners; a build
# that finds all 20 slots taken waits in GitHub's queue instead of moving to Namespace. Any other
# value, or none, leaves the choice to this job.

on:
  workflow_call:
    secrets:
      # Optional. The App's installation token has a far larger hourly API budget than
      # `github.token`, which pr-build.yml's volume would exhaust. Without it, the picker
      # uses `github.token`.
      APP_CLIENT_ID: { required: false }
      APP_PRIVATE_KEY: { required: false }
    outputs:
      github:
        description: "`true` when the caller should run on a GitHub-hosted runner"
        value: ${{ jobs.pick.outputs.github }}

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      github: ${{ steps.pick.outputs.github }}
    steps:
      - name: Check for the App
        id: app
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
        run: echo "present=$([ -n "$APP_CLIENT_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Every repository in the organisation is public, so reading its Actions runs needs no
      # permission beyond metadata.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        if: steps.app.outputs.present == 'true'
        continue-on-error: true
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: Count busy GitHub-hosted jobs
        id: pick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          ORG: ${{ github.repository_owner }}
          BUDGET: ${{ vars.HOSTED_RUNNER_BUDGET || '16' }}
        run: |
          set -uo pipefail
          decide() {
            echo "github=$1" >> "$GITHUB_OUTPUT"
            echo "$2" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          api() { timeout 30 gh api "$@"; }

          case "$BUDGET" in ''|*[!0-9]*) decide false "HOSTED_RUNNER_BUDGET='$BUDGET' is not a number: using Namespace." ;; esac

          repos=$(api --paginate "orgs/$ORG/repos?per_page=100" --jq '.[] | select(.archived | not) | .name') \
            || decide false "Could not list the repositories of $ORG: using Namespace."

          # The calls are independent, so run them eight at a time: one at a time takes most of a
          # minute when the organisation is busy, and every build waits for this answer.
          # Both listings are paginated; `--jq` runs once per page, so the job counts arrive as
          # one number per page and are summed below. A failed page still fails the call and
          # answers Namespace, rather than silently undercounting.
          export ORG
          runs=$(printf '%s\n' $repos | xargs -r -P 8 -n 1 bash -c '
                   set -o pipefail
                   for status in in_progress queued; do
                     timeout 60 gh api --paginate "repos/$ORG/$0/actions/runs?status=$status&per_page=100" \
                       --jq ".workflow_runs[].id | \"$0 \(.)\"" || exit 1
                   done' | sort -u) \
            || decide false "Could not list the active runs in $ORG: using Namespace."
          # A run that moves from queued to in progress between the two calls appears in both
          # lists; `sort -u` above counts it once.
          # One line per job that holds or waits for a GitHub-hosted slot (see the header), as
          # `<repo> <status> <labels>`. `jobs` is the listing's default `filter=latest`, so a
          # re-run's superseded attempts are not counted.
          export HOSTED_JOBS='.jobs[]
            | select(.status == "in_progress" or .status == "queued")
            | select(if .status == "in_progress" then .runner_group_name == "GitHub Actions"
                     else (.labels | any(. == "self-hosted" or startswith("nscloud-")
                                         or startswith("namespace-")) | not)
                          and (.labels | any(test("^(ubuntu|windows|macos)-")))
                     end)
            | "\(.status) \(.labels | join(","))"'
          hosted=$(printf '%s\n' "$runs" | xargs -r -P 8 -n 2 bash -c '
                     set -o pipefail
                     timeout 60 gh api --paginate "repos/$ORG/$0/actions/runs/$1/jobs?per_page=100" \
                       --jq "$HOSTED_JOBS" | sed "s|^|$0 |"') \
            || decide false "Could not list the jobs of the active runs in $ORG: using Namespace."
          # The step shell runs with -e, and grep exits 1 on no match.
          busy=$(printf '%s\n' "$hosted" | grep -c . || true)
          # What was counted, so an unexpected answer can be traced to the jobs behind it.
          {
            echo "Busy GitHub-hosted jobs by repository, status and labels:"
            echo '```'
            printf '%s\n' "$hosted" | grep . | sort | uniq -c | sort -rn || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A drained API budget turns every answer into Namespace, so keep it visible.
          echo "API requests left this hour: $(api rate_limit --jq .resources.core.remaining || echo unknown)" \
            >> "$GITHUB_STEP_SUMMARY"

          if [ "$busy" -le "$BUDGET" ]; then
            decide true "$busy GitHub-hosted jobs busy in $ORG, counting this one (budget $BUDGET): using GitHub."
          fi
          decide false "$busy GitHub-hosted jobs busy in $ORG, counting this one (budget $BUDGET): using Namespace."
