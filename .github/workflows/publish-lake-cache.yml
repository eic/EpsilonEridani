name: publish-lake-cache

# Secret-isolated Lake cache publisher shared by main CI and merge-group CI. The caller may
# execute arbitrary Lean code while producing the staging artifact, so this workflow treats the
# entire artifact and every reported value as hostile. It checks out only the toolchain pin and
# the public-map helper at the immutable revision being published. The helper remains inert until
# the key-bearing upload step has exited; no project or dependency code runs while LAKE_CACHE_KEY
# is present.

on:
  workflow_call:
    inputs:
      revision:
        description: Immutable EpsilonEridani revision whose output map is being published
        required: true
        type: string
      artifact-name:
        description: Name of the staging artifact produced by the caller
        required: true
        type: string
      reported-toolchain:
        description: Toolchain used by the staging build (cross-checked against the revision)
        required: true
        type: string
      publication-required:
        description: Fail rather than skip if cache upload configuration is absent
        required: false
        default: false
        type: boolean
    outputs:
      published:
        description: Whether the revision map was uploaded and observed on the public endpoint
        value: ${{ jobs.publish.outputs.published }}
    secrets:
      LAKE_CACHE_KEY:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.result.outputs.published }}
    steps:
      # Exactly two repository files are admitted. The toolchain names the revision map's object
      # key, so the pin is read independently from the immutable revision rather than trusted
      # from the staging build. The Python helper is present only so
      # a later, key-free step can share the public URL contract with every other cache probe; it
      # is data, never executed, before or during the secret-bearing upload step.
      - name: Check out the toolchain pin and key-free confirmation helper
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          sparse-checkout: |
            lean-toolchain
            scripts/lake_cache_probe.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the staged oleans
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/lake-cache-staging

      - name: Check the staged tree before uploading it
        env:
          STAGING: ${{ runner.temp }}/lake-cache-staging
        run: |
          set -euo pipefail
          # The producer ran arbitrary Lean code. The upload step reads only the flat files here,
          # but every `lake cache get` that later downloads the map joins its artifact names to a
          # local directory, so reject nesting, symlinks, path components, and every other name
          # that could make Lake reach outside a flat data-only directory.
          if find "$STAGING" -mindepth 2 -print -quit | grep -q .; then
            echo "::error::the staged tree is nested; expected a flat directory of artifacts"
            exit 1
          fi
          if find "$STAGING" -mindepth 1 ! -type f -print -quit | grep -q .; then
            echo "::error::the staged tree holds an entry that is not a regular file"
            exit 1
          fi
          python3 - "$STAGING/outputs.jsonl" <<'PY'
          import json, re, sys

          NAME = re.compile(r"\A[0-9A-Za-z]+(\.[0-9A-Za-z]+)*\Z")

          def check(value, lineno):
              if isinstance(value, str):
                  if not NAME.match(value):
                      sys.exit(
                          f"::error::{path} line {lineno}: {value!r} is not a plain artifact name"
                      )
              elif isinstance(value, list):
                  for item in value:
                      check(item, lineno)
              elif isinstance(value, dict):
                  for key, item in value.items():
                      check(key, lineno)
                      check(item, lineno)

          path = sys.argv[1]
          with open(path, encoding="utf-8") as handle:
              lines = 0
              for lineno, line in enumerate(handle, start=1):
                  lines = lineno
                  if lineno > 1:
                      check(json.loads(line), lineno)
          if lines < 2:
              sys.exit(f"::error::{path} contains no root-package output mappings")
          PY

      - name: Read and check the pinned toolchain
        id: toolchain
        env:
          REPORTED: ${{ inputs.reported-toolchain }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$(cat lean-toolchain)"
          case "$TOOLCHAIN" in
            leanprover/lean4:[A-Za-z0-9]*) ;;
            *) echo "::error::lean-toolchain names '$TOOLCHAIN', which is not a leanprover/lean4 release"; exit 1 ;;
          esac
          if [ "$TOOLCHAIN" != "$REPORTED" ]; then
            echo "::error::the staging build used '$REPORTED' but the revision pins '$TOOLCHAIN'"
            exit 1
          fi
          printf 'name=%s\n' "$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Publish the staged Lake cache
        id: upload
        env:
          S3_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT }}
          S3_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
          LAKE_CACHE_KEY_RAW: ${{ secrets.LAKE_CACHE_KEY }}
          ELAN_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
          STAGING: ${{ runner.temp }}/lake-cache-staging
          REVISION: ${{ inputs.revision }}
          PUBLICATION_REQUIRED: ${{ inputs.publication-required }}
        run: |
          set -euo pipefail
          skip_or_fail() {
            if [ "$PUBLICATION_REQUIRED" = true ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::notice::$1"
            exit 0
          }

          case "$REVISION" in
            *[!0-9a-f]*|'') echo "::error::revision is not a lowercase hexadecimal Git object ID"; exit 1 ;;
          esac
          [ "${#REVISION}" = 40 ] || { echo "::error::revision is not a 40-character Git object ID"; exit 1; }
          [ -n "$S3_ARTIFACT_ENDPOINT" ] && [ -n "$S3_REVISION_ENDPOINT" ] \
            || skip_or_fail 'the Lake cache upload endpoints are not configured'
          [ -n "$PUBLIC_REVISION_ENDPOINT" ] \
            || skip_or_fail 'the public Lake revision endpoint is not configured'
          [ -n "$LAKE_CACHE_KEY_RAW" ] \
            || skip_or_fail 'the LAKE_CACHE_KEY secret is not configured'

          KEY="$LAKE_CACHE_KEY_RAW"
          KEY="${KEY%"${KEY##*[![:space:]]}"}"
          [ -n "$KEY" ] || skip_or_fail 'the LAKE_CACHE_KEY secret is empty after trimming'
          echo "::add-mask::$KEY"
          export LAKE_CACHE_KEY="$KEY"

          # Upload here rather than through `lake cache put-staged`. That command sends every
          # artifact in one parallel curl batch and fails the whole batch on any single bad
          # response, then resends all of them on the next call. The endpoint answers roughly 1% of
          # PUTs with a bare 302 or an HTTP/2 stream error (curl 92/55), so across ~165 artifacts a
          # whole batch rarely gets through, and retrying the batch does not converge. One object
          # at a time, each retried until it answers 200, does.
          #
          # The object keys, content types and signing are Lake's own (see
          # docs/cache-infrastructure.md), so `lake cache get` reads the result unchanged. The map
          # goes last, only once every artifact is in, so it is never published ahead of them.
          TC_DIR="${ELAN_TOOLCHAIN//\//--}"
          TC_DIR="${TC_DIR//:/---}"
          case "$TC_DIR" in
            *[!A-Za-z0-9._-]*|'') echo "::error::toolchain '$ELAN_TOOLCHAIN' does not map to a plain key segment"; exit 1 ;;
          esac
          ARTIFACT_PREFIX="$S3_ARTIFACT_ENDPOINT/eic/EpsilonEridani"
          MAP_URL="$S3_REVISION_ENDPOINT/eic/EpsilonEridani/tc/$TC_DIR/$REVISION.jsonl"

          ATTEMPTS=6
          put() {  # <file> <content type> <url>
            local attempt code
            for attempt in $(seq 1 "$ATTEMPTS"); do
              # HTTP/1.1 sidesteps the HTTP/2 stream resets; no -L, so a 302 is a failed attempt.
              code="$(curl -sS -o /dev/null -w '%{http_code}' --http1.1 \
                --aws-sigv4 aws:amz:auto:s3 --user "$LAKE_CACHE_KEY" \
                -X PUT -T "$1" -H "Content-Type: $2" "$3")" || code="$code, curl exit $?"
              [ "$code" = 200 ] && return 0
              echo "::warning::PUT ${1##*/} got $code (attempt $attempt of $ATTEMPTS)"
              [ "$attempt" = "$ATTEMPTS" ] || sleep $((5 * attempt))
            done
            echo "::error::PUT ${1##*/} failed $ATTEMPTS times"
            return 1
          }

          # `lake cache stage` fills the directory with exactly the mapped artifacts, each named
          # `<hash>` or `<hash>.<ext>`; Lake keys an artifact by its hash alone.
          uploaded=0
          for path in "$STAGING"/*; do
            name="${path##*/}"
            [ "$name" = outputs.jsonl ] && continue
            if ! [[ "$name" =~ ^[0-9a-f]{16}(\.[0-9A-Za-z]+)*$ ]]; then
              echo "::error::staged file '$name' is not a <hash>[.<ext>] artifact"
              exit 1
            fi
            put "$path" application/vnd.reservoir.artifact "$ARTIFACT_PREFIX/${name%%.*}.art"
            uploaded=$((uploaded + 1))
          done
          [ "$uploaded" -gt 0 ] || { echo "::error::the staging directory holds no artifacts"; exit 1; }
          echo "uploaded $uploaded artifacts"
          put "$STAGING/outputs.jsonl" application/vnd.reservoir.outputs+json-lines "$MAP_URL"
          echo "uploaded the revision map to $MAP_URL"

          echo 'uploaded=true' >> "$GITHUB_OUTPUT"
          echo "::notice::uploaded the Lake cache for $REVISION"

      # This is intentionally a separate step. The shared repository helper did not execute while
      # LAKE_CACHE_KEY existed in the upload step's environment, and this step receives no secret.
      # It owns the one public-map URL implementation used by main's probe and toolchain_tags.py,
      # while --expected preserves the publisher's stronger byte-for-byte confirmation.
      - name: Confirm the exact revision map on the public endpoint
        id: confirm
        if: ${{ steps.upload.outputs.uploaded == 'true' }}
        env:
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
          ELAN_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
          STAGING: ${{ runner.temp }}/lake-cache-staging
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          observed=0
          for attempt in 1 2 3 4 5 6; do
            if python3 scripts/lake_cache_probe.py --repo eic/EpsilonEridani \
                --expected "$STAGING/outputs.jsonl" \
                "$PUBLIC_REVISION_ENDPOINT" "$ELAN_TOOLCHAIN" "$REVISION"; then
              observed=1
              break
            fi
            echo "::warning::published revision map is not publicly readable yet (attempt $attempt/6)"
            [ "$attempt" = 6 ] || sleep 10
          done
          [ "$observed" = 1 ] || { echo "::error::the published revision map did not become publicly readable"; exit 1; }
          echo 'published=true' >> "$GITHUB_OUTPUT"
          echo "::notice::published and confirmed the Lake cache for $REVISION"

      - name: Report whether publication was confirmed
        id: result
        if: ${{ always() }}
        env:
          CONFIRMED: ${{ steps.confirm.outputs.published }}
        run: |
          if [ "$CONFIRMED" = true ]; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
