name: Mattermost PR backfill

# Manually rewrite every existing bot-authored post in "Tau Ceti" > "PRs"
# from current GitHub metadata. This is deliberately separate from the
# event-driven workflows: normal updates stay fast, while a format migration
# can edit the full history in place without reposting or duplicating messages.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read every post and report changes without writing them"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: mattermost-pr-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.repository == 'eic/EpsilonEridani'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: eic
          repositories: EpsilonEridani
          permission-issues: read
          permission-pull-requests: read
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/pr_status
      - name: Reconcile all existing PR posts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          MATTERMOST_URL: ${{ vars.MATTERMOST_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "${MATTERMOST_BOT_TOKEN:-}" ] || [ -z "${MATTERMOST_CHANNEL_ID:-}" ]; then
            echo "::warning::MATTERMOST_BOT_TOKEN or MATTERMOST_CHANNEL_ID is not set. Skipping Mattermost backfill."
            exit 0
          fi
          set -euo pipefail
          args=(--strict)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi

          # Pass the paginated listing's complete PR metadata to one long-lived
          # process. This stays well below GITHUB_TOKEN's 1,000 requests/hour
          # repository limit and authenticates the Mattermost bot only once.
          gh api --paginate \
            'repos/eic/EpsilonEridani/pulls?state=all&sort=created&direction=asc&per_page=100' \
            --jq '.[] | {
              number,
              state,
              merged: (.merged_at != null),
              head: .head.sha,
              title,
              author: .user.login,
              roadmaps: [.labels[].name | select(startswith("roadmap/"))]
            }' |
            python3 scripts/pr_status/mattermost.py backfill "${args[@]}"
