name: Mattermost PR status (lifecycle)

# Maintain the per-PR message + emoji in the "Tau Ceti" Mattermost channel as a PR is
# opened, reopened, merged, closed, or relabeled. CI- and review-status changes
# are also handled by mattermost-pr-status.yml; label events keep the roadmap shown in
# the post current and make the emoji follow the automatic status-label changes
# promptly. A one-off reaction hiccup is cosmetic and the script swallows it
# (exit 0); a *config* break (bad MATTERMOST_BOT_TOKEN, bot not subscribed) makes the
# script exit non-zero so this run goes red -- that is the only way the breakage
# is visible, since the integration otherwise fails silently.

on:
  # These label writes use the repository GitHub App, not GITHUB_TOKEN, so they
  # generate workflow events. That is what makes review/roadmap changes refresh
  # the Mattermost post promptly.
  pull_request_target:
    types: [opened, reopened, closed, labeled, unlabeled]

permissions:
  contents: read        # checkout the script
  issues: read          # read review scoreboards and in-progress markers
  pull-requests: read   # read PR state
  statuses: read        # read the `build` commit status

# Serialize all Mattermost updates for a given PR head across both zulip workflows, so
# two events can't interleave and leave conflicting reactions. Don't cancel: each
# run reconciles from fresh truth, and we want the last word, not a dropped one.
concurrency:
  group: mattermost-pr-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  mattermost-pr:
    if: github.repository == 'eic/EpsilonEridani'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.1; v1 ignores permission-* inputs
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: eic
          repositories: EpsilonEridani
          permission-issues: read
          permission-pull-requests: read
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/pr_status
      - name: Reconcile Mattermost reactions
        # No continue-on-error: the script exits 0 for cosmetic/transient hiccups
        # and non-zero only for a persistent config break, which we *want* loud.
        # This run going red never blocks a PR: only `build` and `bump-guard` are
        # required checks, and auto-merge gates on the build status + review
        # ledger, not on this workflow.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          MATTERMOST_URL: ${{ vars.MATTERMOST_URL }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          # Feed PR state straight from the event payload so reconcile needs no
          # /pulls API call (a close/merge then makes zero GitHub API calls).
          # Title goes via env, never inline, to avoid any shell injection.
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          if [ -z "${MATTERMOST_BOT_TOKEN:-}" ] || [ -z "${MATTERMOST_CHANNEL_ID:-}" ]; then
            echo "::warning::MATTERMOST_BOT_TOKEN or MATTERMOST_CHANNEL_ID is not set. Skipping Mattermost PR lifecycle update."
            exit 0
          fi
          # A label event's payload can be stale when several label writes race.
          # Force those events through the API fallback so they read current truth.
          if [ "$ACTION" = "labeled" ] || [ "$ACTION" = "unlabeled" ]; then
            unset PR_STATE PR_MERGED PR_HEAD PR_TITLE PR_AUTHOR PR_LABELS_JSON
          fi

          # Only opening/reopening may create a post. Label churn on a closed PR
          # must never resurrect a missing announcement out of chronological order.
          CREATE=""
          if [ "$ACTION" = "opened" ] || [ "$ACTION" = "reopened" ]; then
            CREATE="--create"
          elif [ "$ACTION" = "labeled" ] || [ "$ACTION" = "unlabeled" ]; then
            # Self-heal a transient failure in the original opened run, but
            # only while current GitHub truth still says the PR is open.
            CREATE="--create-if-open"
          fi
          python3 scripts/pr_status/mattermost.py reconcile "$PR" $CREATE
