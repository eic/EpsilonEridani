<!doctype html>
<!-- The interactive module graph of the library. The front end is committed here with the rest
     of the site's static files; its data, module-graph.json, is generated by
     scripts/module_graph.py in the Pages workflow and fetched when the page loads. For a local
     preview, scripts/module_graph.py writes a copy with the data and style.css inlined. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EpsilonEridani Module Graph</title>
<link rel="stylesheet" href="style.css">
<!-- Exact npm releases, which jsDelivr serves unchanged; the integrity hashes are those of the
     published files, so a CDN that serves different bytes is refused instead of run. -->
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"
  integrity="sha384-IWROdLKRsN1UuJywMlWl7/blXQ8GEooN2n7dzTxfEPd7ybYIKCUJ2Ol/1Gpf3YV4"
  crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"
  integrity="sha384-2IH3T69EIKYC4c+RXZifZRvaH5SRUdacJW7j6HtE5rQbvLhKKdawxq6vpIzJ7j9M"
  crossorigin="anonymous"></script>
<style>
/* The viewer's palette is scripts/chart_style.py's, delivered in the data's `style` and set on
   these properties when it loads; until then they fall back to the site's colours from
   style.css, which also supplies --navy-1 and --teal. */
:root {
  --mg-bg: var(--navy-1); --mg-panel: var(--navy-2); --mg-line: var(--line);
  --mg-text: var(--text); --mg-muted: var(--muted); --mg-roadmap: var(--amber-1);
  --mg-sans: system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
h1, h2, h3 { font-family: inherit; letter-spacing: normal; line-height: 1.3; }
body {
  background: var(--mg-bg); color: var(--mg-text); font: 14px/1.45 var(--mg-sans);
  display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 360px;
  grid-template-areas: "bar bar" "graph side";
}
a { color: var(--teal); text-decoration: none; }
a:hover { text-decoration: underline; }
header {
  grid-area: bar; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid var(--mg-line); background: var(--navy-1);
}
header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 700; }
header .home { font-size: 13px; }
header label { color: var(--mg-muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
select, input[type=search], button {
  background: var(--mg-panel); color: var(--mg-text); border: 1px solid var(--mg-line);
  border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 13px;
}
input[type=search] { width: 240px; }
button { cursor: pointer; }
button:hover { border-color: var(--mg-muted); }
#cy { grid-area: graph; min-height: 0; position: relative; }
#busy {
  position: absolute; inset: 0; display: grid; place-items: center; color: var(--mg-muted);
  pointer-events: none;
}
aside {
  grid-area: side; overflow-y: auto; border-left: 1px solid var(--mg-line); padding: 14px 16px;
  background: var(--navy-1);
}
aside h2 { font-size: 15px; margin: 0 0 4px; word-break: break-word; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--mg-muted);
  margin: 16px 0 6px; }
aside ul { list-style: none; margin: 0; padding: 0; }
aside li { padding: 2px 0; word-break: break-word; font-size: 13px; }
aside li .names { color: var(--mg-muted); font-size: 12px; display: block; padding-left: 12px; }
.meta { color: var(--mg-muted); font-size: 12px; }
.chip { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 11px;
  border: 1px solid var(--mg-line); color: var(--mg-muted); margin-right: 4px; }
.link { cursor: pointer; color: var(--teal); }
.legend { display: grid; grid-template-columns: 14px 1fr; gap: 4px 8px; align-items: center;
  font-size: 12px; }
.swatch { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; }
code { font-size: 12px; overflow-wrap: anywhere; }
@media (max-width: 800px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto;
    grid-template-areas: "bar" "graph" "side"; }
  aside { border-left: 0; border-top: 1px solid var(--mg-line); }
  input[type=search] { width: 100%; }
}
</style>
</head>
<body>
<header>
  <a class="home" href="../">← Site</a><h1>EpsilonEridani module graph</h1>
  <input type="search" id="search" list="ids" placeholder="Find a module or roadmap layer…">
  <datalist id="ids"></datalist>
  <label>Library <select id="depth">
    <option value="99">every module</option><option value="3">3 levels</option>
    <option value="2">2 levels</option><option value="1">top directories</option>
  </select></label>
  <span id="pkgControls" style="display:contents"></span>
  <label>Roadmaps <select id="roadmaps">
    <option value="layer">per layer</option><option value="area">per roadmap</option>
    <option value="hidden">hidden</option>
  </select></label>
  <label><input type="checkbox" id="unlinked"> unlinked layers</label>
  <label><input type="checkbox" id="reduce" checked> hide implied imports</label>
  <button id="fit">Fit</button>
  <button id="unfocus" hidden>Show everything</button>
</header>
<div id="cy"><div id="busy">Laying out…</div></div>
<aside id="side"></aside>
<script>
const $ = id => document.getElementById(id);

// The data is inlined by scripts/module_graph.py in a local preview and fetched otherwise.
(async () => {
  let graph = window.MODULE_GRAPH;
  try {
    if (!graph) {
      const r = await fetch('module-graph.json');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      graph = await r.json();
    }
  } catch (err) {
    $('busy').textContent = `The graph data, module-graph.json, could not be loaded (${err.message}). ` +
      'It is generated when the site is published; for a local preview, run scripts/module_graph.py.';
    return;
  }
  if (typeof cytoscape === 'undefined' || typeof dagre === 'undefined') {
    $('busy').textContent = 'The graph libraries (cytoscape.js and dagre, from cdn.jsdelivr.net) ' +
      'could not be loaded.';
    return;
  }
  start(graph);
})();

function start(GRAPH) {
const STYLE = GRAPH.style;
for (const k of ['bg', 'panel', 'line', 'text', 'muted', 'roadmap', 'sans'])
  document.documentElement.style.setProperty('--mg-' + k, STYLE[k]);
const site = getComputedStyle(document.documentElement);
const NAVY = site.getPropertyValue('--navy-1').trim(), TEAL = site.getPropertyValue('--teal').trim();
const PKG_COLORS = { Mathlib: '#93c5fd', Physlib: '#f0abfc', PhyslibAlpha: '#f9a8d4',
  QuantumInfo: '#c4b5fd', TauCeti: '#fcd34d' };
const LIB = 'EpsilonEridani';

const raw = new Map(GRAPH.nodes.map(n => [n.id, n]));
const linked = new Set(GRAPH.edges.filter(e => e.kind === 'roadmap').map(e => e.target));
const packages = [...new Set(GRAPH.nodes.filter(n => n.kind === 'external').map(n => n.package))]
  .sort((a, b) => {
    const o = GRAPH.package_order, i = o.indexOf(a), j = o.indexOf(b);
    return (i < 0 ? 99 : i) - (j < 0 ? 99 : j) || a.localeCompare(b);
  });
const state = { depth: 99, roadmaps: 'layer', unlinked: false, reduce: true, focus: null,
  // Mathlib contributes the most entry points; start it grouped by its second-level namespace.
  pkg: Object.fromEntries(packages.map(p => [p, p === 'Mathlib' ? 'area' : 'module'])) };

const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const pkgColor = p => PKG_COLORS[p] || '#cbd5e1';
const dirColor = d => STYLE.dirs[d] || STYLE.muted;

for (const p of packages) {
  const label = document.createElement('label');
  label.innerHTML = `${esc(p)} <select data-pkg="${esc(p)}"><option value="module">modules</option>` +
    `<option value="area">by namespace</option><option value="package">one node</option>` +
    `<option value="hidden">hidden</option></select>`;
  $('pkgControls').append(label);
}

// --- Grouping: every raw node maps to the node that represents it in the current view. -------

function groupOf(n) {
  if (n.kind === 'module') {
    const parts = n.id.split('.').slice(1);
    return parts.length <= state.depth ? n.id : 'dir:' + parts.slice(0, state.depth).join('/');
  }
  if (n.kind === 'external') {
    const mode = state.pkg[n.package];
    if (mode === 'hidden') return null;
    if (mode === 'package') return 'pkg:' + n.package;
    const parts = n.id.split('.');
    return mode === 'area' && parts.length > 2 ? 'pkg:' + parts.slice(0, 2).join('.') : n.id;
  }
  if (state.roadmaps === 'hidden') return null;
  if (state.roadmaps === 'area') return 'area:' + n.area;
  return state.unlinked || linked.has(n.id) ? n.id : null;
}

function shortLabel(n) {
  if (n.kind === 'external') return n.id.split('.').slice(-2).join('.');
  if (n.kind === 'roadmap') {
    const t = n.label.length > 48 ? n.label.slice(0, 46) + '…' : n.label;
    return `${n.area}\n${t}`;
  }
  // `Basic` alone names a dozen modules; the parent directory disambiguates.
  return n.id.split('.').slice(-2).join('.');
}

function view() {
  const nodes = new Map();
  for (const n of GRAPH.nodes) {
    const g = groupOf(n);
    if (!g) continue;
    if (!nodes.has(g)) {
      const kind = g.startsWith('dir:') ? 'dir' : g.startsWith('pkg:') ? 'package'
        : g.startsWith('area:') ? 'area' : n.kind;
      nodes.set(g, { id: g, kind, members: [], rep: n });
    }
    nodes.get(g).members.push(n);
  }
  const edges = new Map();
  for (const e of GRAPH.edges) {
    const s = groupOf(raw.get(e.source)), t = groupOf(raw.get(e.target));
    if (!s || !t || s === t) continue;
    const k = s + '\u0000' + t;
    if (!edges.has(k)) edges.set(k, { source: s, target: t, kind: e.kind, raw: [] });
    edges.get(k).raw.push(e);
  }
  let list = [...edges.values()];
  if (state.reduce) {
    const implied = reduction(list.filter(e => e.kind === 'import'));
    list = list.filter(e => !implied.has(e));
  }
  if (state.focus && nodes.has(state.focus)) {
    const keep = closure(state.focus, [...edges.values()]);
    for (const id of [...nodes.keys()]) if (!keep.has(id)) nodes.delete(id);
    list = list.filter(e => nodes.has(e.source) && nodes.has(e.target));
  }
  return { nodes, edges: list };
}

// Drop one edge at a time while its target stays reachable without it: reachability is kept,
// and on a DAG this is the transitive reduction (the same rule as scripts/module_graph.py).
function reduction(edges) {
  const succ = new Map();
  for (const e of edges) {
    if (!succ.has(e.source)) succ.set(e.source, new Map());
    succ.get(e.source).set(e.target, e);
  }
  const implied = new Set();
  const sorted = [...edges].sort((a, b) =>
    a.source < b.source ? -1 : a.source > b.source ? 1 : a.target < b.target ? -1 : 1);
  for (const e of sorted) {
    succ.get(e.source).delete(e.target);
    const seen = new Set([e.source]), todo = [e.source];
    while (todo.length && !seen.has(e.target)) {
      for (const w of (succ.get(todo.pop()) || new Map()).keys())
        if (!seen.has(w)) { seen.add(w); todo.push(w); }
    }
    if (seen.has(e.target)) implied.add(e); else succ.get(e.source).set(e.target, e);
  }
  return implied;
}

function closure(id, edges) {
  const up = new Map(), down = new Map();
  for (const e of edges) {
    (down.get(e.source) || down.set(e.source, []).get(e.source)).push(e.target);
    (up.get(e.target) || up.set(e.target, []).get(e.target)).push(e.source);
  }
  const keep = new Set([id]);
  for (const adj of [up, down]) {
    const seen = new Set([id]), todo = [id];
    while (todo.length) for (const w of adj.get(todo.pop()) || [])
      if (!seen.has(w)) { seen.add(w); keep.add(w); todo.push(w); }
  }
  return keep;
}

// --- Rendering -----------------------------------------------------------------------------

function nodeData(v) {
  const n = v.rep;
  const d = { id: v.id, kind: v.kind };
  if (v.kind === 'module') {
    Object.assign(d, { label: shortLabel(n), color: dirColor(n.dir), fill: STYLE.panel,
      border: n.upstream_namespace ? 'dashed' : 'solid' });
  } else if (v.kind === 'dir') {
    const path = v.id.slice(4);
    Object.assign(d, { label: `${path}/  (${v.members.length})`, color: dirColor(path.split('/')[0]),
      fill: STYLE.panel, border: 'double' });
  } else if (v.kind === 'external') {
    Object.assign(d, { label: shortLabel(n), color: pkgColor(n.package), fill: NAVY,
      border: 'solid' });
  } else if (v.kind === 'package') {
    Object.assign(d, { label: `${v.id.slice(4)}  (${v.members.length})`, color: pkgColor(n.package),
      fill: NAVY, border: 'double' });
  } else if (v.kind === 'area') {
    const k = v.members.filter(m => linked.has(m.id)).length;
    Object.assign(d, { label: `${n.area}\n${k}/${v.members.length} layers linked`,
      color: STYLE.roadmap, fill: '#2a2610', border: 'solid' });
  } else {
    Object.assign(d, { label: shortLabel(n), color: STYLE.roadmap, fill: '#2a2610', border: 'solid' });
  }
  const lines = d.label.split('\n');
  d.w = Math.max(...lines.map(l => l.length)) * 6.6 + 18;
  d.h = lines.length * 15 + 10;
  return d;
}

const cy = cytoscape({
  container: $('cy'), wheelSensitivity: 0.25, minZoom: 0.03, maxZoom: 3,
  style: [
    { selector: 'node', style: {
      shape: 'round-rectangle', width: 'data(w)', height: 'data(h)',
      'background-color': 'data(fill)', 'border-color': 'data(color)', 'border-width': 2,
      'border-style': 'data(border)', label: 'data(label)', color: STYLE.text,
      'font-family': getComputedStyle(document.body).fontFamily, 'font-size': 11,
      'text-valign': 'center', 'text-halign': 'center', 'text-wrap': 'wrap' } },
    { selector: 'node[kind="external"], node[kind="package"]', style: { shape: 'tag' } },
    { selector: 'node[kind="roadmap"], node[kind="area"]', style: { shape: 'cut-rectangle',
      color: '#fef9c3' } },
    { selector: 'node[kind="dir"], node[kind="package"], node[kind="area"]',
      style: { 'border-width': 4, 'font-weight': 'bold' } },
    { selector: 'edge', style: { width: 1, 'line-color': 'rgba(154,166,201,0.35)',
      'target-arrow-color': 'rgba(154,166,201,0.6)', 'target-arrow-shape': 'triangle',
      'arrow-scale': 0.6, 'curve-style': 'bezier' } },
    { selector: 'edge[kind="roadmap"]', style: { 'line-style': 'dashed',
      'line-color': 'rgba(253,224,71,0.45)', 'target-arrow-color': 'rgba(253,224,71,0.7)' } },
    { selector: '.faded', style: { opacity: 0.12 } },
    { selector: 'node.up', style: { 'background-color': '#173a3a' } },
    { selector: 'node.down', style: { 'background-color': '#3a1d2c' } },
    { selector: 'edge.up', style: { 'line-color': TEAL, 'target-arrow-color': TEAL,
      width: 2 } },
    { selector: 'edge.down', style: { 'line-color': '#fb7185', 'target-arrow-color': '#fb7185',
      width: 2 } },
    { selector: 'node.sel', style: { 'border-width': 5, 'background-color': '#33416f' } },
  ],
});

function render() {
  $('busy').style.display = 'grid';
  // Let the "Laying out…" note paint before dagre blocks the thread.
  setTimeout(() => {
    const v = view();
    const g = new dagre.graphlib.Graph();
    g.setGraph({ rankdir: 'TB', nodesep: 14, ranksep: 70, edgesep: 6, ranker: 'network-simplex' });
    g.setDefaultEdgeLabel(() => ({}));
    const data = new Map();
    for (const node of v.nodes.values()) {
      const d = nodeData(node);
      data.set(node.id, d);
      g.setNode(node.id, { width: d.w, height: d.h });
    }
    for (const e of v.edges) g.setEdge(e.source, e.target);
    dagre.layout(g);
    compact(g, data);
    // Roadmap layers that reference nothing visible would float to the top; park them in rows
    // below the graph instead, where the targets sit.
    const touched = new Set(v.edges.flatMap(e => [e.source, e.target]));
    let maxY = 0, minX = Infinity, maxX = 0;
    for (const id of g.nodes()) {
      const p = g.node(id);
      if (touched.has(id) || !/^(roadmap|area)$/.test(data.get(id).kind)) {
        maxY = Math.max(maxY, p.y); minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      }
    }
    if (!isFinite(minX)) { minX = 0; maxX = 1200; }
    let x = minX, y = maxY + 140;
    for (const id of g.nodes()) {
      const d = data.get(id);
      if (touched.has(id) || !/^(roadmap|area)$/.test(d.kind)) continue;
      if (x + d.w > Math.max(maxX, minX + 1200)) { x = minX; y += 60; }
      Object.assign(g.node(id), { x: x + d.w / 2, y });
      x += d.w + 14;
    }
    cy.batch(() => {
      cy.elements().remove();
      cy.add([...data.values()].map(d => ({ group: 'nodes', data: d, position: {
        x: g.node(d.id).x, y: g.node(d.id).y } })));
      cy.add(v.edges.map((e, i) => ({ group: 'edges', data: {
        id: 'e' + i, source: e.source, target: e.target, kind: e.kind } })));
    });
    // A centring animation from an earlier selection would otherwise pan away from the fit.
    cy.stop(true);
    cy.fit(undefined, 30);
    currentView = v;
    $('busy').style.display = 'none';
    $('unfocus').hidden = !state.focus;
    if (selected && cy.getElementById(selected).length) select(selected, false);
    else { selected = null; summary(); }
  }, 20);
}

// Dagre's coordinate assignment aligns long vertical chains, and a few ranks hold dozens of
// nodes, so wide graphs spread over tens of thousands of pixels. Bound the width: deal each
// over-wide rank round-robin into staggered sub-rows (keeping dagre's horizontal order within
// each), squeeze every row towards the centre by one common factor, then sweep each row to
// restore the minimum spacing.
function compact(g, data, gap = 14) {
  const ranks = new Map();
  let lo = Infinity, hi = -Infinity, total = 0, tallest = 0;
  for (const id of g.nodes()) {
    const p = g.node(id), y = Math.round(p.y);
    if (!ranks.has(y)) ranks.set(y, []);
    ranks.get(y).push(id);
    lo = Math.min(lo, p.x - p.width / 2); hi = Math.max(hi, p.x + p.width / 2);
    total += p.width + gap; tallest = Math.max(tallest, p.height);
  }
  // Aim for roughly 2.5 : 1, with rows about 70px apart.
  const target = Math.max(1800, Math.sqrt(175 * total)), cx = (lo + hi) / 2;
  const s = Math.min(1, target / (hi - lo));
  let offset = 0;
  for (const y of [...ranks.keys()].sort((a, b) => a - b)) {
    const ids = ranks.get(y).sort((a, b) => g.node(a).x - g.node(b).x);
    const width = ids.reduce((t, id) => t + g.node(id).width + gap, 0);
    const k = Math.ceil(width / target);
    for (let j = 0; j < k; j++) {
      const row = ids.filter((_, i) => i % k === j);
      const want = row.map(id => cx + (g.node(id).x - cx) * s);
      const xs = [];
      row.forEach((id, i) => {
        const w = g.node(id).width;
        xs.push(i ? Math.max(want[i], xs[i - 1] + (g.node(row[i - 1]).width + w) / 2 + gap)
          : want[i]);
      });
      const shift = xs.reduce((t, x, i) => t + want[i] - x, 0) / xs.length;
      row.forEach((id, i) => {
        g.node(id).x = xs[i] + shift;
        g.node(id).y = y + offset + j * (tallest + 18);
      });
    }
    offset += (k - 1) * (tallest + 18);
  }
}

// --- Selection and the side panel ----------------------------------------------------------

let currentView = null, selected = null;

function select(id, center = true) {
  const el = cy.getElementById(id);
  if (!el.length) return;
  selected = id;
  cy.elements().removeClass('faded up down sel');
  const up = el.predecessors(), down = el.successors();
  cy.elements().not(up).not(down).not(el).addClass('faded');
  up.addClass('up'); down.addClass('down'); el.addClass('sel');
  if (center) cy.animate({ center: { eles: el }, zoom: Math.max(cy.zoom(), 0.6) },
    { duration: 300 });
  history.replaceState(null, '', '#' + encodeURIComponent(id));
  details(currentView.nodes.get(id), up.nodes().length, down.nodes().length);
}

function clear() {
  selected = null;
  cy.elements().removeClass('faded up down sel');
  history.replaceState(null, '', location.pathname + location.search);
  summary();
}

// Jump to the view node that currently represents a raw node.
function goto(rawId) {
  const n = raw.get(rawId);
  if (!n) return;
  let g = groupOf(n);
  if (!g) {
    if (n.kind === 'external') state.pkg[n.package] = 'module';
    if (n.kind === 'roadmap') { state.roadmaps = 'layer'; state.unlinked = true; }
    syncControls();
    g = groupOf(n);
  }
  if (state.focus && !currentView.nodes.has(g)) state.focus = null;
  selected = g;
  if (!cy.getElementById(g).length) render(); else select(g);
}

const linkTo = id => `<span class="link" data-goto="${esc(id)}">${esc(id)}</span>`;
const ext = (href, text) => href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(text)}</a>` : '';

function relations(members) {
  const ids = new Set(members.map(m => m.id));
  const into = [], outOf = [];
  for (const e of GRAPH.edges) {
    if (ids.has(e.target) && !ids.has(e.source)) into.push(e);
    if (ids.has(e.source) && !ids.has(e.target)) outOf.push(e);
  }
  return { into, outOf };
}

function list(title, edges, side, withNames) {
  if (!edges.length) return '';
  const groups = new Map();
  for (const e of edges) {
    const id = e[side];
    if (!groups.has(id)) groups.set(id, { names: new Set(), imported: false });
    for (const nm of e.names || []) groups.get(id).names.add(nm);
    groups.get(id).imported ||= !!e.imported;
  }
  const items = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([id, g]) => {
    const n = raw.get(id);
    const label = n.kind === 'roadmap' ? `${n.area}: ${n.label}` : id;
    const why = [...g.names].map(esc);
    if (g.imported) why.push('<i>imported by the roadmap file</i>');
    const extra = withNames && why.length ? `<span class="names">${why.join(', ')}</span>` : '';
    return `<li><span class="link" data-goto="${esc(id)}">${esc(label)}</span>${extra}</li>`;
  });
  return `<h3>${esc(title)} (${groups.size})</h3><ul>${items.join('')}</ul>`;
}

function details(v, nUp, nDown) {
  const n = v.rep;
  const { into, outOf } = relations(v.members);
  const imports = into.filter(e => e.kind === 'import');
  const importedBy = outOf.filter(e => e.kind === 'import');
  const usedBy = outOf.filter(e => e.kind === 'roadmap');
  const uses = into.filter(e => e.kind === 'roadmap');
  let h = '';
  const reach = `<p class="meta"><span style="color:${TEAL}">${nUp} upstream</span> · ` +
    `<span style="color:#fb7185">${nDown} downstream</span> in this view</p>` +
    `<p><button id="focusBtn">Show only this node's up- and downstream</button></p>`;
  if (v.kind === 'module') {
    h += `<h2>${esc(n.title || n.label)}</h2><p class="meta"><code>${esc(n.id)}</code></p>`;
    h += `<p>${n.upstream_namespace ? '<span class="chip">upstream namespace: PhyslibAlpha-eligible</span>' : ''}` +
      `<span class="chip">${n.lines} lines</span><span class="chip">${n.decls} declarations</span></p>`;
    h += `<p>${ext(n.url, 'Source')} · ${ext(n.docs, 'API docs')}</p>` + reach;
    h += list('Imports', imports, 'source') + list('Imported by', importedBy, 'target');
    h += list('Roadmap layers building on it', usedBy, 'target', true);
  } else if (v.kind === 'external') {
    h += `<h2>${esc(n.id)}</h2><p><span class="chip" style="border-color:${pkgColor(n.package)}">` +
      `${esc(n.package)} entry point</span></p>`;
    h += `<p>${ext(n.url, 'Source at the pinned commit')}${n.docs ? ' · ' + ext(n.docs, 'API docs') : ''}</p>`;
    h += reach + list(`Imported by`, importedBy, 'target');
  } else if (v.kind === 'roadmap') {
    h += `<h2>${esc(n.label)}</h2><p class="meta">Roadmap <b>${esc(n.area)}</b>` +
      `${n.completed ? ' (completed)' : ''} · ${n.targets} suggested declarations</p>`;
    h += `<p>${ext(n.url, 'Suggested.lean section')} · ${ext(n.readme, 'README')}</p>` + reach;
    h += uses.length ? list('Library modules it builds on', uses, 'source', true)
      : '<p class="meta">Names no EpsilonEridani declaration: it builds on upstream libraries only, or on targets not yet in the library.</p>';
  } else {
    const what = { dir: `directory ${v.id.slice(4)}/`, package: `${v.id.slice(4)} entry points`,
      area: `roadmap ${n.area}` }[v.kind];
    h += `<h2>${esc(what)}</h2><p class="meta">${v.members.length} collapsed nodes</p>` + reach;
    if (v.kind === 'area') h += `<p>${ext(n.readme, 'README')}</p>`;
    h += `<h3>Members</h3><ul>${v.members.map(m => `<li>${linkTo(m.id)}${m.kind === 'roadmap' ? ' — ' + esc(m.label) : ''}</li>`).join('')}</ul>`;
    h += list('Imports from outside', imports, 'source');
    h += list('Imported by', importedBy, 'target');
    h += list('Roadmap layers', usedBy, 'target', true) + list('Names from', uses, 'source', true);
  }
  $('side').innerHTML = h;
  $('focusBtn').onclick = () => { state.focus = v.id; render(); };
}

function summary() {
  const count = k => GRAPH.nodes.filter(n => n.kind === k).length;
  const implied = GRAPH.edges.filter(e => e.redundant).length;
  const imports = GRAPH.edges.filter(e => e.kind === 'import').length;
  const dirs = Object.entries(STYLE.dirs).map(([d, c]) =>
    `<span class="swatch" style="border-color:${c}"></span><span>${esc(d)}/</span>`).join('');
  const pk = packages.map(p =>
    `<span class="swatch" style="border-color:${pkgColor(p)};background:${NAVY}"></span><span>${esc(p)} entry point</span>`).join('');
  const sha = c => c ? `<code>${c.slice(0, 10)}</code>` : 'unknown';
  $('side').innerHTML = `<h2>${esc(LIB)} module graph</h2>
    <p class="meta">${count('module')} modules · ${count('external')} upstream entry points ·
      ${count('roadmap')} roadmap layers (${linked.size} linked) · ${imports} imports, of which
      ${implied} are implied by others</p>
    <p class="meta">Library ${sha(GRAPH.library_commit)} · roadmaps ${sha(GRAPH.roadmap_commit)} ·
      generated ${esc(GRAPH.generated_at)}</p>
    <h3>Reading it</h3>
    <p class="meta">Arrows point from a module to the modules that import it, so the graph flows
      downstream: upstream entry points at the top, roadmap layers at the bottom. A dashed yellow
      arrow means a roadmap layer builds on that module: its suggested signatures or docstrings
      name a declaration the module defines (a field or constructor counts for its type), or, for
      the first section of a roadmap file, the file imports the module. Both are read from the
      text, not checked by Lean. Click a node to
      highlight what it builds on (<span style="color:${TEAL}">teal</span>) and what builds on
      it (<span style="color:#fb7185">red</span>).</p>
    <h3>Legend</h3><div class="legend">${dirs}${pk}
      <span class="swatch" style="border-color:${STYLE.roadmap};background:#2a2610"></span><span>roadmap layer</span>
      <span class="swatch" style="border-color:${STYLE.muted};border-style:dashed"></span><span>upstream namespace (PhyslibAlpha-eligible)</span>
      <span class="swatch" style="border-color:${STYLE.muted};border-width:4px;border-style:double"></span><span>collapsed group</span>
    </div>`;
}

// --- Controls --------------------------------------------------------------------------------

function syncControls() {
  $('depth').value = state.depth;
  $('roadmaps').value = state.roadmaps;
  $('unlinked').checked = state.unlinked;
  $('reduce').checked = state.reduce;
  for (const s of document.querySelectorAll('[data-pkg]')) s.value = state.pkg[s.dataset.pkg];
}

$('depth').onchange = e => { state.depth = +e.target.value; state.focus = null; render(); };
$('roadmaps').onchange = e => { state.roadmaps = e.target.value; state.focus = null; render(); };
$('unlinked').onchange = e => { state.unlinked = e.target.checked; render(); };
$('reduce').onchange = e => { state.reduce = e.target.checked; render(); };
for (const s of document.querySelectorAll('[data-pkg]'))
  s.onchange = e => { state.pkg[s.dataset.pkg] = e.target.value; state.focus = null; render(); };
$('fit').onclick = () => cy.fit(undefined, 30);
$('unfocus').onclick = () => { state.focus = null; render(); };
$('side').addEventListener('click', e => {
  const t = e.target.closest('[data-goto]');
  if (t) goto(t.dataset.goto);
});
cy.on('tap', 'node', e => select(e.target.id(), false));
cy.on('tap', e => { if (e.target === cy) clear(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') clear(); });

$('ids').innerHTML = GRAPH.nodes.map(n =>
  `<option value="${esc(n.id)}">${n.kind === 'roadmap' ? esc(n.area + ': ' + n.label) : ''}</option>`).join('');
$('search').addEventListener('change', e => {
  const q = e.target.value.trim();
  if (!q) return;
  const hit = raw.get(q) || GRAPH.nodes.find(n => n.id.endsWith('.' + q)) ||
    GRAPH.nodes.find(n => (n.id + ' ' + (n.label || '')).toLowerCase().includes(q.toLowerCase()));
  if (hit) goto(hit.id);
});

const initial = decodeURIComponent(location.hash.slice(1));
if (initial && raw.has(initial)) selected = initial;
syncControls();
render();
}
</script>
</body>
</html>
